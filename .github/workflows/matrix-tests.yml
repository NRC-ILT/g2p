name: Run full matrix Tests before Releases
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  pre-release-matrix-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.15

      - name: Get current week number
        shell: bash
        run: echo "WEEK_NUMBER=$(date -u +%Y-%V)" >> $GITHUB_OUTPUT
        id: weekno
      - name: Caching of HuggingFace models for neural tests
        uses: actions/cache@v5
        with:
          key: g2p-neural-${{ steps.weekno.outputs.WEEK_NUMBER }}
          path: ~/.cache/huggingface

      - name: Install uv and thereby enable caching its cache in CI
        uses: astral-sh/setup-uv@v7

      - name: Set pretend version for g2p
        shell: bash
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=$(cat .SETUPTOOLS_SCM_PRETEND_VERSION)" >> $GITHUB_ENV

      - name: Run matrix testing using hatch as configured in pyproject.toml
        run: uvx hatch test -a
